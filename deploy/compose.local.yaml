# Compose >= 2.24.4. These overrides bind ONLY to the local machine.
services:
  caddy:
    ports: !override
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    networks:
      web:
        aliases: [site.localhost, cms.localhost]
  frontend:
    environment:
      NODE_EXTRA_CA_CERTS: /local-ca/root.crt
    volumes:
      - ./.local-ca/root.crt:/local-ca/root.crt:ro
