name: ${COMPOSE_PROJECT_NAME:-urslja-gora}
services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-strapi}
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the private environment file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  strapi:
    build:
      context: ../cms/urslja-gora-cms
      args:
        PUBLIC_URL: ${NEXT_PUBLIC_STRAPI_URL:?Set the public CMS URL before building the admin panel}
    image: ${COMPOSE_PROJECT_NAME:-urslja-gora}-strapi:${RELEASE_TAG:-local}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-strapi}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      DATABASE_SSL: "false"
      DATABASE_POOL_MIN: 0
      DATABASE_POOL_MAX: 5
      PUBLIC_URL: ${NEXT_PUBLIC_STRAPI_URL:?Set the public CMS URL}
      CORS_ORIGINS: ${NEXT_PUBLIC_SITE_URL:?Set the public website URL}
      TRUST_PROXY: "true"
      APP_KEYS: ${APP_KEYS:?Set APP_KEYS}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?Set API_TOKEN_SALT}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?Set TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      STRAPI_TELEMETRY_DISABLED: "true"
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - uploads:/app/public/uploads
    networks: [web, database]
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:1337/_health").then(r=>process.exit(r.status===204?0:1)).catch(()=>process.exit(1))']
      start_period: 90s
      interval: 15s
      timeout: 5s
      retries: 6
    logging: *logging

  frontend:
    build:
      context: ..
      args:
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL:?Set the public CMS URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set the public website URL}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}}
        ALLOW_PRIVATE_CMS_IMAGES: ${ALLOW_PRIVATE_CMS_IMAGES:-false}
    image: ${COMPOSE_PROJECT_NAME:-urslja-gora}-frontend:${RELEASE_TAG:-local}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      STRAPI_INTERNAL_URL: http://strapi:1337
      CONTACT_LOCAL_TEST: "false"
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set the public website URL}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_EXPECTED_HOSTNAME: ${TURNSTILE_EXPECTED_HOSTNAME:-${SITE_DOMAIN:?Set SITE_DOMAIN}}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-465}
      EMAIL_SECURE: ${EMAIL_SECURE:-true}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_TO: ${EMAIL_TO:-}
    depends_on:
      strapi: {condition: service_healthy}
    networks: [web]
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 6
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
      CMS_DOMAIN: ${CMS_DOMAIN:?Set CMS_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]
    logging: *logging

networks:
  web:
  database:
    internal: true
volumes:
  postgres-data:
  uploads:
  caddy-data:
  caddy-config:
